<script>
  // STORAGE
  const KEY = "agex_foundation21_v1";
<div class="card" style="margin-bottom:14px">
  <h2 style="margin-bottom:6px">Foundation Class — 21 Days</h2>
  <p class="muted" style="margin-top:0">
    Daily action + daily proof. Consistency is the currency.
  </p>

  <div class="row" style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
    <div class="field" style="min-width:220px;flex:1">
      <label for="daySelect">Choose Day</label>
      <select id="daySelect"></select>
    </div>

    <div class="field" style="min-width:180px">
      <label>Progress</label>
      <div class="pill" id="progressPill" style="padding:10px 12px;border:1px solid var(--line);border-radius:12px">
        0 / 21 completed
      </div>
    </div>

    <div class="field" style="min-width:180px">
      <label>Today</label>
      <div class="pill" id="todayTitle" style="padding:10px 12px;border:1px solid var(--line);border-radius:12px">
        —
      </div>
    </div>
  </div>

  <div class="hr"></div>

  <div class="field">
    <label for="dayObjective">Objective</label>
    <textarea id="dayObjective" readonly></textarea>
  </div>

  <div class="field">
    <label for="dayActionPlan">Stewardship Action (do today)</label>
    <textarea id="dayActionPlan" placeholder="Complete the action shown above. You may edit to fit your reality."></textarea>
  </div>

  <div class="field">
    <label for="dayProof">Daily Proof (submit / screenshot / write)</label>
    <textarea id="dayProof" placeholder="Example: Screenshot your spending log OR write your 2–4 line reflection OR paste your totals."></textarea>
  </div>

  <div class="field">
    <label for="dayReflection">Reflection (2–4 lines)</label>
    <textarea id="dayReflection" placeholder="What did you notice today? What did you correct? What will you repeat tomorrow?"></textarea>
  </div>

  <div class="row" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <label style="display:flex;gap:10px;align-items:center">
      <input type="checkbox" id="dayDone" />
      <span><b>Mark Day as Completed</b> (daily commitment proof)</span>
    </label>
  </div>
</div>

  // dayIndexNDATION FIELDS (your essence)
  const coreFields = ["identity","leak1","leak2","leak3","rules","action"];

  // DAILY FIELDS
  const dailyFields = ["dayActionPlan","dayProof","dayReflection","dayDone"];

  // 21-DAY CURRICULUM (Module 1)
  const curriculum = [
    { title:"Day 1 — Money as a Tool", objective:"Replace chaos with identity. Define what money is FOR in your life.", action:"Write your Money Origin Story (5–10 lines). Then write 1 sentence: “Money is a tool for _____.”", proof:"A screenshot or written note containing your Money Origin Story + the 1-sentence definition." },
    { title:"Day 2 — Needs vs Wants vs Vanity", objective:"Learn to classify spending without shame—only clarity.", action:"List 10 recent expenses. Label each: Need, Want, or Vanity.", proof:"List with labels + one sentence: “My top category today was ____.”" },
    { title:"Day 3 — Identify Your Top 3 Leaks", objective:"Expose where money escapes unnoticed.", action:"Identify your #1, #2, #3 money leaks. Add one example for each.", proof:"Three leaks + examples (text or screenshot)." },
    { title:"Day 4 — Define “Enough”", objective:"Stop chasing vague goals. Define a stable target.", action:"Write what “enough” means for this season: food, transport, bills, savings, support.", proof:"Your “Enough Definition” (short paragraph)." },
    { title:"Day 5 — Draft Your Stewardship Covenant", objective:"Commit to rules you can actually obey.", action:"Write your personal Stewardship Covenant (5–7 lines).", proof:"Covenant draft." },
    { title:"Day 6 — Add Constraints", objective:"Discipline becomes real when it has boundaries.", action:"Add 3 constraints to your covenant (limits, caps, or refusals).", proof:"Covenant + 3 constraints." },
    { title:"Day 7 — Write Your 5 Money Rules", objective:"Lock your non-negotiables.", action:"Write your 5 Money Rules (1–5). Keep them simple and enforceable.", proof:"Your 5 Money Rules (milestone proof)." },

    { title:"Day 8 — Track Every Expense (No Judgment)", objective:"Awareness is the beginning of control.", action:"Track every expense today. Total at night.", proof:"Total spend + 3 biggest categories." },
    { title:"Day 9 — One Leak Cut", objective:"Prove that discipline can be immediate.", action:"Choose 1 leak and cut it today (or reduce by 50%).", proof:"Leak chosen + what you did + result." },
    { title:"Day 10 — Daily Money Routine", objective:"Build a repeatable rhythm.", action:"Design a 10-minute daily routine: Morning check + Evening total.", proof:"Routine written (2 lines) + confirmation you did it." },
    { title:"Day 11 — Saving Rule", objective:"Stability requires a saving habit, not intention.", action:"Write one saving rule you can keep weekly (even small).", proof:"Saving rule + next save date." },
    { title:"Day 12 — Emergency Discipline", objective:"Emergencies test systems. Prepare mentally.", action:"Write what you will do when emergencies strike (3 steps).", proof:"Your 3-step emergency response plan." },
    { title:"Day 13 — Weekly Review Template", objective:"Stewards review. They don’t guess.", action:"Create a weekly review template: income, expenses, leaks, wins, next actions.", proof:"Your review template." },
    { title:"Day 14 — 7-Day Review", objective:"Confirm what changed through proof.", action:"Review Days 8–14. Write 3 wins and 2 corrections.", proof:"3 wins + 2 corrections (milestone proof)." },

    { title:"Day 15 — Refusal Practice", objective:"Wealth protection begins with refusal.", action:"Identify 2 spending triggers. Write your refusal script for each.", proof:"2 triggers + refusal scripts." },
    { title:"Day 16 — Budget in One Page", objective:"Your budget must be simple enough to obey.", action:"Write a one-page budget: needs, wants cap, savings, support, buffer.", proof:"One-page budget (text or screenshot)." },
    { title:"Day 17 — Accountability Loop", objective:"Consistency is easier when verified.", action:"Choose an accountability method (buddy, group, or self-proof). Define rules.", proof:"Accountability method + rules." },
    { title:"Day 18 — Discipline Stress Test", objective:"Test discipline under pressure.", action:"Simulate a “temptation day” and follow your rules anyway.", proof:"What temptation appeared + what rule you enforced." },
    { title:"Day 19 — Recommitment", objective:"Stewardship is maintained, not declared once.", action:"Rewrite your covenant in tighter language (3–5 lines).", proof:"New covenant version." },
    { title:"Day 20 — System Lock", objective:"Turn lessons into a personal system.", action:"Write your personal money system: Routine + Rules + Review + Refusal.", proof:"Your 4-part system summary." },
    { title:"Day 21 — Foundation Completion Proof", objective:"Submit a complete foundation snapshot.", action:"Compile: Identity statement + 3 leaks + 5 rules + routine + weekly review template.", proof:"Complete Foundation Proof (milestone)." }
  ];

  // Helpers
  function $(id){ return document.getElementById(id); }

  function defaultState(){
    return {
      core: {},
      days: curriculum.map(() => ({
        actionPlan:"",
        proof:"",
        reflection:"",
        done:false
      }))
    };
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(KEY);
      if(!raw) return defaultState();
      const data = JSON.parse(raw);
      // Backward safety
      if(!data.days || data.days.length !== 21) return defaultState();
      return data;
    }catch(e){
      return defaultState();
    }
  }

  function saveState(state){
    localStorage.setItem(KEY, JSON.stringify(state));
    const t = $("toast");
    if(t){
      t.style.display="block";
      setTimeout(()=>t.style.display="none", 2600);
    }
  }

  function completedCount(state){
    return state.days.filter(d => d.done).length;
  }

  // Day select setup
  function initDaySelect(){
    const sel = $("daySelect");
    if(!sel) return;
    sel.innerHTML = "";
    curriculum.forEach((d, i) => {
      const opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = d.title;
      sel.appendChild(opt);
    });
  }

  function renderDay(state, dayIndex){
    const d = curriculum[dayIndex];
    const day = state.days[dayIndex];

    if($("todayTitle")) $("todayTitle").textContent = `Day ${dayIndex+1}`;
    if($("dayObjective")) $("dayObjective").value = d.objective;

    // Pre-fill action if empty
    if(!day.actionPlan){
      day.actionPlan = d.action;
    }
    if(!day.proof){
      day.proof = d.proof;
    }

    $("dayActionPlan").value = day.actionPlan || "";
    $("dayProof").value = day.proof || "";
    $("dayReflection").value = day.reflection || "";
    $("dayDone").checked = !!day.done;

    // Progress pill
    if($("progressPill")){
      $("progressPill").textContent = `${completedCount(state)} / 21 completed`;
    }
  }

  function bindCore(state){
    coreFields.forEach(id => {
      const el = $(id);
      if(!el) return;
      if(state.core[id] !== undefined) el.value = state.core[id];
      el.addEventListener("input", () => {
        state.core[id] = el.value;
        saveState(state);
      });
    });
  }

  function bindDay(state){
    const sel = $("daySelect");
    if(!sel) return;

    function persistDay(dayIndex){
      const day = state.days[dayIndex];
      day.actionPlan = $("dayActionPlan").value;
      day.proof = $("dayProof").value;
      day.reflection = $("dayReflection").value;
      day.done = $("dayDone").checked;
      saveState(state);
      if($("progressPill")){
        $("progressPill").textContent = `${completedCount(state)} / 21 completed`;
      }
    }

    sel.addEventListener("change", () => {
      const idx = parseInt(sel.value, 10);
      renderDay(state, idx);
    });

    dailyFields.forEach(id => {
      const el = $(id);
      if(!el) return;
      el.addEventListener("input", () => {
        const idx = parseInt(sel.value, 10);
        persistDay(idx);
      });
      el.addEventListener("change", () => {
        const idx = parseInt(sel.value, 10);
        persistDay(idx);
      });
    });
  }

  function clearAll(){
    localStorage.removeItem(KEY);
    location.reload();
  }

  // Buttons you already have
  $("saveBtn")?.addEventListener("click", () => {
    // Manual save trigger (state is auto-saved, but keep your UX)
    const state = loadState();
    saveState(state);
  });
  $("clearBtn")?.addEventListener("click", clearAll);

  // Submission button behaviour (unchanged)
  $("submitProofBtn")?.addEventListener("click", (e) => {
    e.preventDefault();
    alert("Submission will be enabled when the proof form is attached. For now: Save your work and return to Dashboard.");
  });

  // INIT
  const state = loadState();
  initDaySelect();

  // Default day = first incomplete, else Day 21
  const firstIncomplete = state.days.findIndex(d => !d.done);
  const startIndex = firstIncomplete === -1 ? 20 : firstIncomplete;

  if($("daySelect")){
    $("daySelect").value = String(startIndex);
  }

  bindCore(state);
  bindDay(state);
  renderDay(state, startIndex);
</script>
